<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slate - rebuild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════════════════════════
     SLATE - a rebuild of the designer's comp, from nothing.

     Not a reskin of the game. Every element here is new markup: none of the shipping
     ids, classes or components are involved, and nothing does anything. It exists to
     answer one question - what does this direction actually look like, built.

     Everything is drawn at the comp's own scale (854px wide artboard) and the whole thing
     is scaled to fit the viewport, so the numbers below are the measured numbers rather
     than a translation of them. They were read off the image with a canvas scan - panel
     edges, tile runs, disc diameters - not estimated by eye.

       shell        812 wide, 32 padding        panels   radius 24
       HUD panel    y 66,   h 307               pet      y 396,  h 259
       board        y 678,  h 852               dock     y 1558, h 228
       tile         84x84, pitch 104            rows     pitch 112
       locked disc  d 74, pitch 175             current  126x126

     The board painting is the comp's own pixels, positioned by offset, so that part is
     exact rather than approximated. The cat is the portrait the designer supplied.
     ═══════════════════════════════════════════════════════════════════════════════════════ -->

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:#1e1e1e; font-family:Nunito,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; }

  /* the artboard is fixed at the comp's size and scaled to whatever it is being read on.
     Centring is done by the transform itself rather than by the layout: a scaled element
     still occupies its UNSCALED box, so letting flow or grid centre it puts the visible
     result somewhere the maths does not predict. */
  #fit{ position:fixed; left:0; top:0; width:854px; height:1842px; transform-origin:0 0; }

  #shell{
    position:absolute; left:21px; top:31px; width:812px; height:1781px;
    background:#dfeafb; border-radius:44px; padding:35px 32px;
    display:flex; flex-direction:column;
  }

  .panel{ border-radius:24px; }

  /* ══ HUD ══ level, score, moves, pouch - then a hairline, then the round's ask ══ */
  #hud{ background:#2a4063; height:307px; padding:22px 26px 0; display:flex; flex-direction:column; }
  #hudtop{ display:flex; align-items:flex-start; gap:18px; }

  #burger{ width:38px; padding-top:14px; display:flex; flex-direction:column; gap:7px; flex:0 0 auto; }
  #burger i{ display:block; height:5px; border-radius:3px; background:#a1c3ec; }

  #lvl{ flex:0 0 auto; padding-top:6px; }
  #lvl b{ display:block; font-size:20px; font-weight:800; color:#a9bcd8; letter-spacing:.06em; line-height:1.1; }
  #lvl span{ display:block; font-size:36px; font-weight:900; color:#fff; line-height:1.05; }

  #centre{ flex:1; text-align:center; padding-top:8px; }
  #score{ font-size:29px; font-weight:800; color:#fff; letter-spacing:.005em; }
  #track{ width:245px; height:16px; border-radius:99px; background:#475777; margin:14px auto 0; }
  #moves{ font-size:22px; font-weight:700; color:#a9bcd8; margin-top:13px; }

  #pouch{ flex:0 0 auto; margin-top:8px; display:flex; align-items:center; gap:11px;
    background:#3c5070; border-radius:99px; padding:13px 22px; }
  #pouch em{ width:24px; height:24px; border-radius:50%; background:#ffb323; display:block; }
  #pouch b{ font-size:27px; font-weight:800; color:#fff; }
  #pouch i{ font-size:25px; font-weight:700; color:#c3d6f0; font-style:normal; }

  #rule{ height:1px; background:#475777; margin:26px -26px 0; }

  #ask{ flex:1; display:flex; align-items:center; gap:18px; }
  #badge{ width:150px; height:88px; border-radius:99px; flex:0 0 auto;
    border:3px solid #ffb323; background:rgba(255,179,35,.10);
    box-shadow:0 0 22px rgba(255,179,35,.30), inset 0 0 14px rgba(255,179,35,.12);
    display:flex; align-items:center; justify-content:center; gap:12px; }
  #badge b{ font-size:31px; font-weight:900; color:#fff; }
  .ring{ width:44px; height:44px; border-radius:50%; flex:0 0 auto;
    border:5px solid #ffb323; display:grid; place-items:center; }
  .ring::after{ content:""; width:14px; height:14px; border-radius:50%; background:#ffb323; }
  #asktext{ flex:1; display:flex; align-items:center; justify-content:flex-end; gap:14px; padding-right:4px; }
  #asktext .ring{ width:36px; height:36px; border-width:4px; }
  #asktext .ring::after{ width:11px; height:11px; }
  #asktext p{ font-size:26px; font-weight:800; color:#fff; }
  #asktext u{ font-size:25px; font-weight:800; color:#a1c3ec; text-decoration:none; }

  /* ══ THE FRIENDS SHELF ══ */
  #pets{ background:#3e577d; height:259px; margin-top:23px; padding:34px 30px 0;
    display:flex; align-items:flex-start; gap:0; justify-content:space-between; }
  .seat{ width:150px; text-align:center; }
  .mount{ width:110px; height:116px; margin:0 auto; background:#fff; border-radius:14px;
    padding:6px; box-shadow:0 3px 9px rgba(10,26,50,.30); }
  .mount img{ width:100%; height:100%; object-fit:cover; border-radius:9px; display:block; }
  .disc{ width:74px; height:74px; margin:21px auto 0; border-radius:50%; background:#566c8d;
    display:grid; place-items:center; font-size:38px; font-weight:900; color:#c3d6f0; }
  .seat b{ display:block; margin-top:15px; font-size:22px; font-weight:800; color:#fff; }
  .seat span{ display:block; margin-top:5px; font-size:20px; font-weight:700; color:#a9bcd8; }
  .seat.locked b{ margin-top:22px; }

  /* ══ THE BOARD ══ the comp's own painting, placed by offset ══ */
  #board{ height:852px; margin-top:23px; border-radius:24px; overflow:hidden; position:relative;
    background-image:url("../../alternate_art/Screenshot%202026-08-03%20at%2019.48.19.png");
    background-position:-55px -678px; background-repeat:no-repeat;
    box-shadow:0 8px 22px rgba(22,44,78,.16); }
  #grid{ position:absolute; left:21px; top:33px; }
  .row{ display:flex; gap:20px; margin-bottom:28px; }
  .row.short{ justify-content:center; padding-right:2px; }
  .tile{ width:84px; height:84px; border-radius:13px; background:#fdfbf7; position:relative;
    display:grid; place-items:center; font-size:43px; font-weight:900; color:#445872;
    box-shadow:0 3px 0 rgba(28,48,80,.13), 0 5px 11px rgba(20,40,70,.17); }
  .tile s{ position:absolute; right:9px; bottom:4px; font-size:17px; font-weight:800;
    color:#8b9bb3; text-decoration:none; }

  /* ══ THE DOCK ══ */
  #dock{ background:#bcd6b9; height:228px; margin-top:28px; border-radius:24px;
    display:flex; align-items:center; padding:0 38px; gap:0; }
  .pill{ width:101px; height:101px; border-radius:50%; position:relative; flex:0 0 auto;
    display:grid; place-items:center; font-size:44px;
    box-shadow:0 3px 7px rgba(24,54,32,.18); }
  .pill.leaf{ background:#e1f3de; }
  .pill.star{ background:#ffdce5; }
  .pill u{ position:absolute; top:-3px; right:-3px; width:38px; height:38px; border-radius:50%;
    display:grid; place-items:center; font-size:21px; font-weight:800; color:#fff; text-decoration:none; }
  .pill.leaf u{ background:#4e8c46; }
  .pill.star u{ background:#ef6f8e; }

  #cur{ width:126px; height:126px; border-radius:18px; background:#fdfbf7; margin-left:44px;
    position:relative; display:grid; place-items:center; font-size:62px; font-weight:900; color:#445872;
    box-shadow:0 4px 0 rgba(28,48,80,.13), 0 8px 15px rgba(20,40,70,.16); }
  #cur s{ position:absolute; right:12px; bottom:6px; font-size:21px; font-weight:800;
    color:#8b9bb3; text-decoration:none; }

  #queue{ display:flex; gap:30px; margin-left:48px; }
  .slot{ text-align:center; }
  .slot i{ display:block; font-size:21px; font-weight:900; letter-spacing:.13em; color:#4e6b52;
    font-style:normal; margin-bottom:9px; }
  .slot .tile{ width:74px; height:74px; font-size:36px; border-radius:12px; }
  #spacer{ flex:1; }
</style>

<div id="fit">
  <div id="shell">

    <div class="panel" id="hud">
      <div id="hudtop">
        <div id="burger"><i></i><i></i><i></i></div>
        <div id="lvl"><b>LEVEL</b><span>3</span></div>
        <div id="centre">
          <div id="score">Score: 0/35</div>
          <div id="track"></div>
          <div id="moves">Moves: 19</div>
        </div>
        <div id="pouch"><em></em><b>260</b><i>+</i></div>
      </div>
      <div id="rule"></div>
      <div id="ask">
        <div id="badge"><span class="ring"></span><b>5/5</b></div>
        <div id="asktext"><span class="ring"></span><p>reach 35 points</p><u>tap ▸</u></div>
      </div>
    </div>

    <div class="panel" id="pets">
      <div class="seat">
        <div class="mount"><img src="../../alternate_art/CatImage.png" alt=""></div>
        <b>Calico</b><span>Active</span>
      </div>
      <div class="seat locked"><div class="disc">?</div><b>Lv 7</b><span>Locked</span></div>
      <div class="seat locked"><div class="disc">?</div><b>Lv 10</b><span>Locked</span></div>
      <div class="seat locked"><div class="disc">?</div><b>Lv 14</b><span>Locked</span></div>
    </div>

    <div id="board">
      <div id="grid">
        <div class="row short">
          <div class="tile">R<s>1</s></div><div class="tile">E<s>1</s></div>
          <div class="tile">F<s>4</s></div><div class="tile">C<s>3</s></div>
        </div>
        <div class="row">
          <div class="tile">R<s>1</s></div><div class="tile">E<s>1</s></div><div class="tile">B<s>3</s></div>
          <div class="tile">E<s>1</s></div><div class="tile">U<s>1</s></div><div class="tile">W<s>4</s></div>
          <div class="tile">T<s>1</s></div>
        </div>
        <div class="row">
          <div class="tile">C<s>3</s></div><div class="tile">W<s>4</s></div><div class="tile">S<s>1</s></div>
          <div class="tile">H<s>4</s></div><div class="tile">U<s>1</s></div><div class="tile">L<s>1</s></div>
          <div class="tile">I<s>1</s></div>
        </div>
      </div>
    </div>

    <div class="panel" id="dock">
      <div class="pill leaf">🌿<u>3</u></div>
      <div id="cur">D<s>2</s></div>
      <div id="queue">
        <div class="slot"><i>NEXT</i><div class="tile">B</div></div>
        <div class="slot"><i>THEN</i><div class="tile">?</div></div>
      </div>
      <div id="spacer"></div>
      <div class="pill star">⭐<u>2</u></div>
    </div>

  </div>
</div>

<script>
  // the artboard is a fixed 854x1842; scale it to whatever it is being read on, and do the
  // centring in the same transform so the visible result is exactly where the maths says
  const fit = () => {
    const s = Math.min(innerWidth / 854, innerHeight / 1842);
    const x = (innerWidth  - 854  * s) / 2;
    const y = (innerHeight - 1842 * s) / 2;
    document.getElementById("fit").style.transform =
      "translate(" + x + "px," + y + "px) scale(" + s + ")";
  };
  addEventListener("resize", fit); fit();
</script>
