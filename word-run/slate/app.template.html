<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Slate - working prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════════════════════════
     SLATE - the designer's comp, built as a working screen.

     New markup end to end: none of the game's ids, classes or components are involved. What
     IS carried over is the behaviour, because a still picture cannot answer the questions a
     direction has to answer. Does a white card still read against the painting once it is
     sitting in a stack of eight? Does a 20px gutter survive a column filling up? You cannot
     see that in a mockup, only in something you can drop a letter into.

     So the physics are the game's physics: a letter falls to the lowest empty cell of the
     column you tap, lands on what is already there, and the column refuses when it is full.
     Words clear across a row or up and down a column, everything above collapses into the
     gap, and a cascade can set off another one.

     Geometry is the comp's, measured off the image rather than estimated:
       shell 812 wide, padding 32        panels radius 24
       HUD   y 66,   h 307               pets   y 396,  h 259
       board y 678,  h 852               dock   y 1558, h 228
       tile  84x84, pitch 104            rows   pitch 112
       disc  d 74, pitch 175             current tile 126x126

     THE ONE CHANGE I MADE ON PURPOSE: the comp shows the letters floating at the top of the
     board. Dropped letters fall, so they are anchored to the FLOOR here and grow upward -
     otherwise the board reads as a title card rather than a place a tile is going to land.
     ═══════════════════════════════════════════════════════════════════════════════════════ -->

<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#1e1e1e; font-family:Nunito,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none; }
  :root{ --pane:#2a4063; --pane2:#3e577d; --line:#475777; --pouch:#3c5070; --slot:#566c8d; --page:#dfeafb;
    --ink:#3e5170; --edge:#c3cfdf; --dock:#bcd6b9; --dockink:#4e6b52; }
  #fit{ position:fixed; left:0; top:0; width:854px; height:1842px; transform-origin:0 0; }

  #shell{ position:absolute; left:21px; top:31px; width:812px; height:1781px;
    background:var(--page); border-radius:44px; padding:35px 32px; display:flex; flex-direction:column; }
  .panel{ border-radius:24px; }
  .tap{ cursor:pointer; transition:transform .09s ease; }
  .tap:active{ transform:scale(.94); }

  /* ══ HUD ══ */
  #hud{ background:var(--pane);  height:307px; padding:22px 26px 0; display:flex; flex-direction:column; }
  #hudtop{ display:flex; align-items:flex-start; gap:18px; }
  #burger{ width:38px; padding-top:14px; display:flex; flex-direction:column; gap:7px; flex:0 0 auto; }
  #burger i{ display:block; height:5px; border-radius:3px; background:#a1c3ec; }
  #lvl{ flex:0 0 auto; padding-top:6px; }
  #lvl b{ display:block; font-size:20px; font-weight:800; color:#a9bcd8; letter-spacing:.06em; line-height:1.1; }
  #lvl span{ display:block; font-size:36px; font-weight:900; color:#fff; line-height:1.05; }
  #centre{ flex:1; text-align:center; padding-top:8px; }
  #score{ font-size:29px; font-weight:800; color:#fff; }
  #track{ width:245px; height:16px; border-radius:99px; background:var(--line); margin:14px auto 0; overflow:hidden; }
  #fill{ height:100%; width:100%; background:#ffb323; border-radius:99px;
    transform:scaleX(0); transform-origin:left center;
    transition:transform .45s cubic-bezier(.2,.7,.3,1); }
  #moves{ font-size:22px; font-weight:700; color:#a9bcd8; margin-top:13px; }
  #pouch{ flex:0 0 auto; margin-top:8px; display:flex; align-items:center; gap:11px;
    background:var(--pouch); border-radius:99px; padding:13px 22px; }
  #pouch em{ width:24px; height:24px; border-radius:50%; background:#ffb323; display:block; }
  #pouch b{ font-size:27px; font-weight:800; color:#fff; }
  #pouch i{ font-size:25px; font-weight:700; color:#c3d6f0; font-style:normal; }
  #rule{ height:1px; background:var(--line); margin:26px -26px 0; }
  #ask{ flex:1; display:flex; align-items:center; gap:18px; }
  #badge{ width:150px; height:88px; border-radius:99px; flex:0 0 auto;
    border:3px solid #ffb323; background:rgba(255,179,35,.10);
    box-shadow:0 0 22px rgba(255,179,35,.30), inset 0 0 14px rgba(255,179,35,.12);
    display:flex; align-items:center; justify-content:center; gap:12px; }
  #badge b{ font-size:31px; font-weight:900; color:#fff; }
  .ring{ width:44px; height:44px; border-radius:50%; flex:0 0 auto;
    border:5px solid #ffb323; display:grid; place-items:center; }
  .ring::after{ content:""; width:14px; height:14px; border-radius:50%; background:#ffb323; }
  #asktext{ flex:1; display:flex; align-items:center; justify-content:flex-end; gap:14px; padding-right:4px; }
  #asktext .ring{ width:36px; height:36px; border-width:4px; }
  #asktext .ring::after{ width:11px; height:11px; }
  #asktext p{ font-size:26px; font-weight:800; color:#fff; }
  #asktext u{ font-size:25px; font-weight:800; color:#a1c3ec; text-decoration:none; }

  /* ══ FRIENDS ══ */
  #pets{ background:var(--pane2);  height:259px; margin-top:23px; padding:34px 30px 0;
    display:flex; align-items:flex-start; justify-content:space-between; }
  .seat{ width:150px; text-align:center; }
  /* the portraits arrive with their own gold ring and pastel field baked into the JPEG, so a
     white card around them is a SECOND frame - and at shelf size that card was eating a fifth
     of the face. The medallion is the mount. #pets.boxed restores the comp's card if the two
     ever need comparing again. */
  .mount{ width:116px; height:116px; margin:0 auto; border-radius:50%; overflow:hidden;
    background:none; padding:0; box-shadow:0 3px 10px rgba(10,26,50,.32); }
  .mount img{ width:100%; height:100%; object-fit:cover; display:block;
    border-radius:50%; transform:scale(1.03); }
  #pets.boxed .mount{ width:110px; height:116px; background:#fff; border-radius:14px;
    padding:6px; overflow:visible; }
  #pets.boxed .mount img{ border-radius:9px; transform:none; }
  .disc{ width:74px; height:74px; margin:21px auto 0; border-radius:50%; background:var(--slot);
    display:grid; place-items:center; font-size:38px; font-weight:900; color:#c3d6f0; }
  .seat b{ display:block; margin-top:15px; font-size:22px; font-weight:800; color:#fff; }
  .seat span{ display:block; margin-top:5px; font-size:20px; font-weight:700; color:#a9bcd8; }
  .seat.locked b{ margin-top:22px; }
  .seat.lit .mount{ box-shadow:0 0 0 4px #ffb323, 0 3px 9px rgba(10,26,50,.30); }

  /* ══ BOARD ══ the country's own painting, as the game hangs it ══ */
  #board{ height:852px; touch-action:none; cursor:pointer; margin-top:23px; border-radius:24px; overflow:hidden; position:relative;
    background-image:url("../art/bg/bio0.jpg"); background-size:cover; background-position:center 62%;
    box-shadow:0 8px 22px rgba(22,44,78,.16); }
  /* ══ A TILE IS A POSITION AND A FACE ══ the position moves, the face deforms. They are two
     elements because a squash is a transform and so is a fall, and one element cannot do
     both without the landing cancelling the arrival. The game splits them for this reason. */
  .tile{ position:absolute; width:94px; height:94px; }
  /* ══ A TILE IS A SLAB, NOT A CARD ══ the comp draws a flat rectangle and it reads as a
     sticker lying on the painting. What gives the game's letters their weight is not colour,
     it is FOUR shadows doing separate jobs: a hard un-blurred bottom edge that IS the
     thickness, a soft drop beneath it for the ground, a bright inset along the top where the
     light lands, and a darker inset at the base where the slab turns away from it.
     The game runs a 5px edge on a 44px cell. At 94px that is 10 - and because the gutter is
     8, the edge laps 2px over the tile below, which is what makes a column read as stacked
     rather than as counters left near each other. */
  .face{ width:100%; height:100%; border-radius:15px; background:#fdfbf7; position:relative;
    display:grid; place-items:center; font-size:49px; font-weight:900; color:var(--ink);
    overflow:hidden;
    text-shadow:0 2px 0 rgba(255,255,255,.9), 0 -1px 0 rgba(96,116,146,.30);
    box-shadow:
      0 10px 0 var(--edge),
      0 15px 16px rgba(20,40,70,.30),
      inset 0 4px 0 rgba(255,255,255,.95),
      inset 0 -9px 10px rgba(126,146,176,.30),
      inset 0 0 0 2px rgba(255,255,255,.55); }
  /* the sheen across the top third, so the face is lit rather than merely pale */
  .face::before{ content:""; position:absolute; top:3px; left:7%; right:34%; height:32%;
    border-radius:50%; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.75), transparent); }
  .face s{ position:absolute; right:11px; bottom:7px; font-size:19px; font-weight:800;
    color:#8296b0; text-decoration:none; text-shadow:0 1px 0 rgba(255,255,255,.8); }
  .tile.fall{ transition:top .26s cubic-bezier(.35,.85,.4,1); }   /* the collapse after a clear */
  .tile.ghost .face{ background:rgba(253,251,247,.30); color:rgba(68,88,114,.55); box-shadow:none;
    outline:3px dashed rgba(253,251,247,.75); outline-offset:-3px; }
  .tile.ghost{ pointer-events:none; } .tile.ghost s{ display:none; }
  .tile.carry{ pointer-events:none; z-index:9; }
  .tile.carry .face{ transform:scale(1.06);
    box-shadow:0 10px 0 rgba(28,48,80,.13), 0 16px 26px rgba(20,40,70,.30); }

  /* the landing, lifted from the game: squash on impact, bounce with a tilt, counter-tilt
     back. The whole thing is 380ms and it is most of why a drop feels like it weighs
     something rather than like a sprite arriving at a coordinate. */
  .face.landsquash{ animation:landsquash .38s; }
  @keyframes landsquash{
    0%{ transform:scaleY(1); } 28%{ transform:scaleY(.64) scaleX(1.28) translateY(11%); }
    55%{ transform:translateY(-13%) scaleY(1.08) rotate(-1.8deg); }
    78%{ transform:translateY(2%) scaleY(.97) rotate(.9deg); } 100%{ transform:none; } }
  /* and the impact travels DOWN through whatever is already stacked underneath */
  .face.jostle{ animation:jostle .2s; }
  @keyframes jostle{ 50%{ transform:scaleY(.88) translateY(7%); } }

  .tile.win .face{ background:#ffe6ac; color:#7a5a10;
    box-shadow:0 0 0 4px #ffb323, 0 5px 11px rgba(20,40,70,.2); }
  .tile.gone .face{ transition:transform .22s ease-in, opacity .22s ease-in;
    transform:scale(.4); opacity:0; }
  .dust{ position:absolute; width:94px; height:16px; pointer-events:none; border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,255,255,.85), rgba(255,255,255,0));
    animation:dust .42s ease-out forwards; }
  @keyframes dust{ 0%{ transform:scale(.5); opacity:.9; } 100%{ transform:scale(1.9); opacity:0; } }
  #shout{ position:absolute; left:0; right:0; top:26px; text-align:center; pointer-events:none;
    font-size:38px; font-weight:900; color:#fff; text-shadow:0 3px 12px rgba(12,28,54,.7);
    opacity:0; transition:opacity .2s; letter-spacing:.02em; }
  #shout.on{ opacity:1; }

  /* ══ DOCK ══ */
  #dock{ background:var(--dock); height:228px; margin-top:28px; display:flex; align-items:center; padding:0 38px; }
  .pill{ width:101px; height:101px; border-radius:50%; position:relative; flex:0 0 auto;
    display:grid; place-items:center; font-size:44px; box-shadow:0 3px 7px rgba(24,54,32,.18); }
  .pill.leaf{ background:#e1f3de; } .pill.star{ background:#ffdce5; }
  .pill.won{ animation:won .42s; }
  @keyframes won{ 0%{ transform:none } 40%{ transform:scale(1.18) } 100%{ transform:none } }
  .pill.armed{ box-shadow:0 0 0 5px #ffb323, 0 3px 7px rgba(24,54,32,.18); }
  .pill u{ position:absolute; top:-3px; right:-3px; width:38px; height:38px; border-radius:50%;
    display:grid; place-items:center; font-size:21px; font-weight:800; color:#fff; text-decoration:none; }
  .pill.leaf u{ background:#4e8c46; } .pill.star u{ background:#ef6f8e; }
  .pill.out{ opacity:.45; }
  #cur{ width:126px; height:126px; border-radius:18px; background:#fdfbf7; margin-left:44px;
    position:relative; display:grid; place-items:center; font-size:62px; font-weight:900; color:var(--ink);
    box-shadow:0 4px 0 rgba(28,48,80,.13), 0 8px 15px rgba(20,40,70,.16); }
  #cur s{ position:absolute; right:12px; bottom:6px; font-size:21px; font-weight:800; color:#8b9bb3; text-decoration:none; }
  #cur.pop{ animation:pop .2s ease-out; }
  @keyframes pop{ 0%{ transform:scale(.8) translateY(-10px);} 100%{ transform:none;} }
  #queue{ display:flex; gap:30px; margin-left:48px; }
  .slot{ text-align:center; }
  .slot i{ display:block; font-size:21px; font-weight:900; letter-spacing:.13em; color:var(--dockink);
    font-style:normal; margin-bottom:9px; }
  .slot .tile{ position:static; width:74px; height:74px; }
  .slot .face{ font-size:36px; border-radius:12px; }
  #spacer{ flex:1; }


  /* ══ THE CEREMONIES ══ the game's cards, in the country's own colours.
     One card shape does the intro, the clear, the loss and the reveal, because four
     differently-shaped cards is how a game starts feeling like four games. What changes is
     the crown at the top, the numbers, and the verb on the button. */

  /* ══════════════════════════════════════════════════════════════════════════════════════
     THE FEEL, ported from the game rather than approximated.

     THE BOARD IS RESTLESS WHILE THE BREEZE IS ARMED. Every letter the wind can move sways,
     each on its own offset so a field of grass does not all sway together - and the offsets
     are NEGATIVE, so every tile is already mid-twitch on the first frame. A positive delay
     makes a tile wait its turn and the whole mode looks like it is still loading.
     What will not budge simply stops moving. The game's own note is worth keeping: fading
     those out lost the board rather than explaining it, because what a player needs to see
     is what is NOT moving.
     ══════════════════════════════════════════════════════════════════════════════════════ */
  #board.breezing .tile.swappable .face{
    box-shadow:0 5px 0 var(--edge), 0 8px 12px rgba(20,40,70,.30),
      0 0 0 1.5px rgba(150,205,240,.9), 0 0 12px rgba(116,180,221,.45);
    animation:restless .34s ease-in-out infinite; }
  #board.breezing .tile:not(.swappable) .face{ animation:none; }
  @keyframes restless{
    0%,100%{ transform:translate(-.4px,-2px) rotate(-1.1deg) }
    50%    { transform:translate(.4px,-2.6px) rotate(1.1deg) } }
  @media (prefers-reduced-motion:reduce){ #board.breezing .tile.swappable .face{ animation:none } }

  /* the gust - a soft slow drift of light across the board, not a hard sweep */
  .gustsweep{ position:absolute; inset:0; z-index:22; pointer-events:none;
    border-radius:inherit; overflow:hidden; }
  .gustsweep::before, .gustsweep::after{ content:""; position:absolute; top:0; bottom:0; width:60%;
    background:radial-gradient(60% 120% at 50% 50%, rgba(255,255,255,.30), rgba(210,235,245,.14) 55%, transparent 75%);
    filter:blur(3px); left:-60%; animation:driftgust 1.8s cubic-bezier(.3,.5,.5,.9) forwards; }
  .gustsweep::after{ top:35%; animation-delay:.18s; animation-duration:2.1s; opacity:.7; }
  @keyframes driftgust{ 0%{ left:-60%; opacity:0 } 15%{ opacity:1 } 85%{ opacity:1 } 100%{ left:105%; opacity:0 } }

  /* the wish: silver starlight drifts down, so a letter changing in your hand is something
     that HAPPENED rather than something you notice afterwards */
  .starfall{ position:absolute; z-index:70; pointer-events:none; font-size:20px; color:#fff;
    text-shadow:0 0 7px rgba(255,255,255,.9), 0 0 15px rgba(205,225,255,.75);
    animation:starfalling linear forwards; }
  @keyframes starfalling{ 0%{ transform:translateY(-20px) rotate(0); opacity:0 } 12%{ opacity:1 }
    100%{ transform:translateY(var(--fall)) rotate(320deg); opacity:0 } }

  /* THE BEAT. A word is COUNTED OUT - one letter lit at a time, the banner growing by a
     character with each. It is the game's signature moment and the first pass replaced it
     with a line of text. */
  .tile.lit .face{ transform:scale(1.04); z-index:5;
    box-shadow:0 5px 0 var(--edge), 0 0 14px rgba(255,179,35,.60); filter:brightness(1.10); }
  .wordbox{ position:absolute; z-index:6; pointer-events:none; border-radius:15px;
    border:3px solid #ffb323;
    box-shadow:0 0 18px rgba(255,179,35,.45), inset 0 0 14px rgba(255,179,35,.16);
    animation:wordboxin .22s ease-out; }
  @keyframes wordboxin{ from{ opacity:0; transform:scale(.94) } to{ opacity:1; transform:scale(1) } }

  /* ══ THE BANNER IS SIZED AGAINST THE TILE, NOT PICKED BY EYE ══ the game runs 22-28px type
     on a 44px cell - between a half and two thirds the width of a letter it is announcing.
     This board's letters are 94px, so a 26px banner read as a caption rather than as the
     word: correct number, wrong board. Everything on it scales by the same 94/44, including
     the padding, the rule and the tracking, or the box merely gets taller than its type. */
  #wb{ position:absolute; left:50%; top:22px; transform:translateX(-50%); z-index:40;
    pointer-events:none; display:none; white-space:nowrap; max-width:94%;
    background:rgba(255,255,255,.96); border:5px solid #ffb323; border-radius:26px;
    padding:14px 40px 17px; font-weight:900; letter-spacing:7px; color:#8a6212;
    box-shadow:0 12px 30px rgba(20,40,70,.38); animation:wbin .2s; }
  #wb.on{ display:block; }
  @keyframes wbin{ from{ transform:translateX(-50%) scale(.5); opacity:0 } }
  #wb .wb-pts{ font-style:normal; font-weight:900; letter-spacing:1px; font-size:.62em;
    margin-left:20px; padding:5px 19px 7px; border-radius:999px; vertical-align:middle;
    color:#2b4a20; background:#cfe9a8; }
  #wb.done{ color:var(--ink); border-color:#7fd18a; }
  /* the breath form: the SAME banner arrives early as the hold invitation, then the payout
     takes it over - so the offer to keep a word lives ON the word */
  #wb.breath{ letter-spacing:4px; padding:14px 36px 22px; overflow:visible; }
  #wb .wb-tap{ font-size:.42em; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:#2e6b4c; margin-left:22px; vertical-align:4px; }
  #wb .wb-clock{ position:absolute; left:5px; right:5px; bottom:0; height:8px; border-radius:4px;
    background:#ffb323; transform-origin:left; animation:breathdrain linear forwards; }
  @keyframes breathdrain{ from{ transform:scaleX(1) } to{ transform:scaleX(0) } }


  /* the letter you have picked has to LOOK picked, or the second tap is a guess. This rule
     and the refusal shake below were both written earlier and both silently failed to land,
     because the patch that added them aimed at an anchor that was no longer in the file. */
  /* NOTE THE SPECIFICITY. The armed-breeze rule above is #board.breezing .tile.swappable
     .face - one id and four classes - and a picked tile is still a swappable one, so a
     plain .tile.selswap rule loses to it and the selection does nothing but stop swaying.
     The picked state has to be written at the same weight as the state it overrides. */
  #board.breezing .tile.selswap .face,
  .tile.selswap .face{
    box-shadow:0 5px 0 #d1900f, 0 10px 16px rgba(20,40,70,.36),
      0 0 0 3px #ffb323, 0 0 20px rgba(255,179,35,.75) !important;
    transform:scale(1.07) !important; filter:brightness(1.08);
    animation:none !important; }

  /* a control that refuses must look like it refused - a dead tap is otherwise
     indistinguishable from a missed one */
  .deny{ animation:deny .38s; }
  @keyframes deny{ 0%,100%{ transform:none } 20%{ transform:translateX(-5px) }
    45%{ transform:translateX(5px) } 70%{ transform:translateX(-3px) } }

  #veil{ position:absolute; inset:0; background:rgba(8,16,32,.55); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:40; }
  #veil.on{ display:flex; }
  #card{ width:660px; background:var(--pane); border-radius:34px; padding:44px 46px 38px;
    text-align:center; box-shadow:0 26px 60px rgba(6,14,30,.45);
    transform:translateY(24px) scale(.97); opacity:0; transition:.3s cubic-bezier(.2,.8,.3,1); }
  #veil.on #card{ transform:none; opacity:1; }
  #crown{ font-size:56px; line-height:1; margin-bottom:6px; }
  #ctry{ font-size:23px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:#ffb323; margin-bottom:10px; }
  #ctitle{ font-size:40px; font-weight:900; color:#fff; line-height:1.15; }
  #csub{ font-size:24px; font-weight:700; color:#a9bcd8; margin-top:12px; line-height:1.45; }
  #cnums{ display:flex; justify-content:center; gap:56px; margin:30px 0 6px; }
  #cnums div b{ display:block; font-size:21px; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; color:#a9bcd8; }
  #cnums div span{ display:block; font-size:48px; font-weight:900; color:#fff; margin-top:4px; }
  #stars{ display:flex; justify-content:center; gap:16px; margin-bottom:14px; }
  #stars i{ width:52px; height:52px; border-radius:50%; border:5px solid #ffb323;
    display:grid; place-items:center; font-style:normal; }
  #stars i::after{ content:""; width:18px; height:18px; border-radius:50%; background:#ffb323; }
  #stars i.off{ border-color:var(--slot); }
  #stars i.off::after{ background:var(--slot); }
  #cbtn{ margin-top:26px; font:inherit; font-size:27px; font-weight:900; color:#2b2011;
    background:#ffb323; border:0; border-radius:99px; padding:19px 46px; cursor:pointer;
    box-shadow:0 5px 0 #d1900f; }
  #cbtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #d1900f; }
  #calt{ display:block; margin:16px auto 0; background:none; border:0; font:inherit;
    font-size:22px; font-weight:800; color:#a1c3ec; cursor:pointer; }
  #cmeet{ width:150px; height:150px; margin:0 auto 14px; border-radius:50%; overflow:hidden;
    box-shadow:0 0 0 5px #ffb323, 0 10px 26px rgba(6,14,30,.5); display:none; }
  #cmeet img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ══ small overlays, so a control that is tapped actually does something ══ */
  #sheet{ position:absolute; left:32px; right:32px; bottom:32px; background:#2a4063; border-radius:24px;
    padding:30px 34px; color:#fff; transform:translateY(140%); transition:transform .3s cubic-bezier(.2,.8,.3,1); }

<script>
/* THE GUTTER WAS THE PROBLEM, NOT THE TILE. The comp draws 84px letters with a 20px gap -
   a gutter almost a quarter the width of the thing it separates, so the board reads as
   scattered counters rather than a stack. The game runs CELL 44 / GAP 4, a ratio of .091,
   and that tightness is what makes a column look like one object.
   94 and 8 lands at .085 across the comp's own 706px of inner board - and it is the size
   at which EIGHT rows fit, which is the game's board exactly. */
const COLS=7, ROWS=8, TILE=94, GAPX=8, GAPY=8, PAD=21;
const BOARD_H=852, BOARD_W=748;
const VAL={a:1,b:3,c:3,d:2,e:1,f:4,g:2,h:4,i:1,j:8,k:5,l:1,m:3,n:1,o:1,p:3,q:10,r:1,s:1,t:1,u:1,v:4,w:4,x:8,y:4,z:10};
const BAG="aaaaaaaeeeeeeeeeiiiiiioooooounnnnnrrrrrtttttllllssssdddgggbcmpfhvwykjxqz";
/* ══ THE GAME'S OWN DICTIONARY ══ 62,817 words, injected at build time from the same
   list the shipping game uses. The prototype ran on a hand-typed three hundred, which was
   enough to prove that a word could clear and nothing else. Every real question about this
   game - is the deck fair, is a round winnable, does a four-letter word turn up often
   enough to matter - is a question about the actual word list. */
const COMMON=new Set("__COMMON__".split(" "));
const WORDS=COMMON;

let S={ lv:3, score:0, target:35, moves:19, amber:260, leaf:3, star:2, wordsMade:0, wordsNeed:5,
        grid:[], cur:null, next:null, then:null, armed:null, busy:false,
        swapSel:null, wishedHand:false, noWishGrant:false, noBreezeGrant:false,
        playerMove:false, breathMs:2000 };

const $=id=>document.getElementById(id);
const boardEl=$("board");
const colX = c => PAD + c*(TILE+GAPX);
const rowY = r => BOARD_H - PAD - (ROWS-r)*TILE - (ROWS-1-r)*GAPY;
const pick = () => BAG[Math.floor(Math.random()*BAG.length)];
const piece = () => ({ l:pick() });

function faceHTML(letter){ return letter.toUpperCase()+'<s>'+(VAL[letter]||1)+'</s>'; }
function makeTile(letter, col, row, fromTop){
  const d=document.createElement("div");
  d.className="tile fall";
  const f=document.createElement("div");
  f.className="face"; f.innerHTML=faceHTML(letter);
  d.appendChild(f);
  d.style.left=colX(col)+"px";
  d.style.top=(fromTop ? -110 : rowY(row))+"px";
  /* a slab's edge overhangs what is under it, so the HIGHER tile has to paint later */
  d.style.zIndex=String(ROWS-row);
  boardEl.appendChild(d);
  d._face=f;
  return d;
}
function anim(el, cls, ms){ el.classList.add(cls); setTimeout(()=>el.classList.remove(cls), ms); }
function dustAt(col,row){
  const d=document.createElement("div"); d.className="dust";
  d.style.left=colX(col)+"px"; d.style.top=(rowY(row)+TILE-8)+"px";
  boardEl.appendChild(d); setTimeout(()=>d.remove(), 440);
}

function firstEmpty(c){ for(let r=ROWS-1;r>=0;r--) if(!S.grid[r][c]) return r; return -1; }

/* ══ THE CONTROL THE GAME ACTUALLY HAS ══
   Not "tap a column and a tile appears there". Press anywhere on the board and the letter
   LIFTS OUT OF THE DOCK into your fingers; a ghost shows the cell it would land in; sliding
   across moves both; letting go drops it. Release somewhere it cannot go and the letter is
   handed back rather than swallowed.
   And the piece you are holding is the piece that falls - it keeps the position it had at
   the moment of release, so the fall starts where your finger was rather than from the top
   of the board. The duration is the distance actually travelled, 80ms plus 42 per cell, so
   a release high above the stack still falls at the honest speed and a release just above
   the landing cell takes the 80ms floor instead of dawdling. */
const STEP = TILE + GAPY;
let aiming=false, aimId=null, carryEl=null, ghostEl=null, hoverCol=-1;

function colFromEvent(e){
  const r=boardEl.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*BOARD_W;
  const c=Math.floor((x-PAD+GAPX/2)/(TILE+GAPX));
  return (c<0||c>=COLS) ? -1 : c;
}
function boardPoint(e){
  const r=boardEl.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*BOARD_W, y:(e.clientY-r.top)/r.height*BOARD_H };
}
function showGhost(c){
  if(ghostEl){ ghostEl.remove(); ghostEl=null; }
  if(c<0 || S.busy || S.armed) return;
  const land=firstEmpty(c); if(land<0) return;
  const g=document.createElement("div");
  g.className="tile ghost";
  g.innerHTML='<div class="face">'+S.cur.l.toUpperCase()+'</div>';
  g.style.left=colX(c)+"px"; g.style.top=rowY(land)+"px";
  boardEl.appendChild(g); ghostEl=g;
}
function lift(e){
  const p=boardPoint(e);
  carryEl=document.createElement("div");
  carryEl.className="tile carry";
  carryEl.innerHTML='<div class="face">'+faceHTML(S.cur.l)+'</div>';
  carryEl._face=carryEl.firstChild;
  boardEl.appendChild(carryEl);
  moveCarry(p);
  $("cur").style.visibility="hidden";          // the letter is in your hand, not in the dock
}
function moveCarry(p){ if(!carryEl) return;
  carryEl.style.left=(p.x-TILE/2)+"px"; carryEl.style.top=(p.y-TILE/2)+"px"; }
function handBack(){
  if(carryEl){ carryEl.remove(); carryEl=null; }
  $("cur").style.visibility="";
}
function aimStop(){ aiming=false; aimId=null; if(ghostEl){ ghostEl.remove(); ghostEl=null; } hoverCol=-1; }

boardEl.addEventListener("pointerdown", e=>{
  if(S.busy || S.armed) return;
  aiming=true; aimId=e.pointerId;
  try{ boardEl.setPointerCapture(e.pointerId); }catch(_){}
  hoverCol=colFromEvent(e); showGhost(hoverCol); lift(e);
});
boardEl.addEventListener("pointermove", e=>{
  if(!aiming || e.pointerId!==aimId) return;
  const c=colFromEvent(e);
  if(c!==hoverCol){ hoverCol=c; showGhost(c); }
  moveCarry(boardPoint(e));
});
boardEl.addEventListener("pointercancel", e=>{
  if(!aiming || e.pointerId!==aimId) return;
  aimStop(); handBack();
});
/* ══ A LETTER MAY NEVER BE LEFT IN MID-AIR ══ a pointer that goes away without ever
   reporting up - the window loses focus, the tab is hidden, a devtools drag, a gesture the
   OS decides to take over - used to strand the carried tile floating over the board with the
   dock slot still empty. Any of those hand the letter back. */
["blur","contextmenu"].forEach(ev=>addEventListener(ev, ()=>{ if(aiming){ aimStop(); handBack(); } }));
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && aiming){ aimStop(); handBack(); } });
boardEl.addEventListener("pointerup", e=>{
  if(!aiming || e.pointerId!==aimId) return;
  const from=carryEl ? parseFloat(carryEl.style.top) : null;
  const c=colFromEvent(e);
  aimStop();
  try{ boardEl.releasePointerCapture(e.pointerId); }catch(_){}
  if(c<0) return handBack();
  const land=firstEmpty(c);
  if(land<0){ handBack(); shout("that column is full"); setTimeout(hideShout,900); return; }
  release(c, land, from);
});

async function release(c, land, fromY){
  S.busy=true;
  const target=rowY(land);
  const t=carryEl; carryEl=null;
  t.classList.remove("carry");
  t.style.left=colX(c)+"px";
  if(fromY==null) fromY=-110;
  t.style.top=fromY+"px";
  const cells=Math.max(0,(target-fromY)/STEP);
  const fallMs=80+Math.round(cells*42);       // the game's own timing, distance-based
  /* ACCELERATING, not easing out. A falling thing speeds up; the first pass used an
     ease-out and every drop glided to a halt, which is most of why it read as floaty. */
  t.style.transition="top "+fallMs+"ms cubic-bezier(.55,0,.85,.55), left 90ms ease-out";
  requestAnimationFrame(()=>{ t.style.top=target+"px"; });
  await wait(fallMs+20);
  t.style.transition="";
  anim(t._face, "landsquash", 400);
  dustAt(c, land);
  /* the impact carries DOWN through whatever it landed on, one tile at a time */
  for(let r=land+1, d=0; r<ROWS; r++, d++){
    const below=S.grid[r][c];
    if(below) setTimeout(()=>anim(below.el._face, "jostle", 220), 30+d*28);
  }
  S.grid[land][c]={ l:S.cur.l, kind:S.cur.kind||"normal", el:t };
  /* the letter that just landed was a wish's doing, so the word it makes grants no wish.
     The flag is spent here, on the drop, not on the resolve - later words in the same round
     pay normally. */
  S.noWishGrant = !!S.wishedHand; S.wishedHand=false;
  S.playerMove=true;                 // this word is yours, so it gets a breath
  S.moves--;
  advance(); $("cur").style.visibility=""; paint();
  await wait(110);
  await resolve();
  S.noWishGrant=false;
  S.busy=false;
  if(S.moves<=0 && S.score<S.target){ S.busy=true; await wait(420); stageLost(); }
}

function advance(){ S.cur=S.next; S.next=S.then; S.then=piece(); $("cur").classList.remove("pop"); void $("cur").offsetWidth; $("cur").classList.add("pop"); }

/* ══ THE GAME'S OWN READING RULES ══ ported from src/50-words.js rather than reinvented.
   Three things the placeholder had wrong, each of which changes what is winnable:

     ROWS READ LEFT TO RIGHT ONLY. The prototype accepted a row backwards, which is a whole
     extra class of word for free. In the game reading a row backwards is the BAT's doing -
     a friend you have to have met and put on duty - and handing it out by default would
     quietly delete that friend's reason to exist.

     COLUMNS READ BOTH WAYS, always. Down, and up the way you stacked it.

     LONGEST FIRST, FROM EACH POSITION, capped at eight. Scanning short-first would take CAT
     out of CATCH and pay you three points for a five-point word.

   Overlapping hits de-dupe by cell, so a palindrome read both ways is one word, paid once. */
const MIN_LEN=3, MAX_LEN=8;
function readLine(cells, map){
  const hits=[];
  let seg=[], segAt=[];
  const flush=()=>{
    let pos=0;
    while(pos <= seg.length-MIN_LEN){
      let hit=null;
      for(let L=Math.min(seg.length-pos, MAX_LEN); L>=MIN_LEN; L--){
        const w=seg.slice(pos,pos+L).join("");
        if(WORDS.has(w)){ hit={ word:w, at:segAt.slice(pos,pos+L) }; break; }
      }
      if(hit){ hits.push(hit); pos+=hit.at.length; } else pos++;
    }
    seg=[]; segAt=[];
  };
  for(let k=0;k<=cells.length;k++){
    const cell = k<cells.length ? cells[k] : null;
    if(cell){ seg.push(cell.l); segAt.push(map(k)); }
    else flush();
  }
  return hits;
}
function scan(){
  const hits=[], seen=new Set();
  const push=h=>{
    const key=h.at.map(p=>p.r+","+p.c).sort().join("|");
    if(seen.has(key)) return; seen.add(key); hits.push({ w:h.word, seg:h.at });
  };
  for(let r=0;r<ROWS;r++)
    readLine(S.grid[r], c=>({r,c})).forEach(push);                       // left to right only
  for(let c=0;c<COLS;c++){
    const col=[]; for(let r=0;r<ROWS;r++) col.push(S.grid[r][c]);
    readLine(col, r=>({r,c})).forEach(push);                             // down
    readLine([...col].reverse(), r=>({ r:ROWS-1-r, c })).forEach(push);  // and up
  }
  return hits;
}

/* ══════════════════════════════════════════════════════════════════════════════════════
   THE BREATH - the beat this build was missing entirely, which is why there was never time
   to hold a word.

   The game's order is not "make word, score word". It is:

     the tool finishes what it is doing        gust drifts, tiles trade places
     every letter of the word lights AT ONCE   with one box drawn round the whole run
     the word waits                            "tap to hold", on a draining clock
     -> tapped:  the letters stay on the board and the word is SPENT, never scored
     -> ignored: everything unlights, and only THEN does the beat count it out

   Two rules keep it from becoming a nuisance. It happens on the FIRST word only - a cascade
   is already a reward and does not stop to ask. And it is skipped when it would be cruel or
   pointless: out of moves, or the word is a friend's name you have been hunting.

   The held word is spent against those exact tiles, so a cascade jostling them later cannot
   re-clear the same word - a tester once saved WIT for WITH, made BOX nearby, and watched
   both pop. */
async function breath(hits, cells){
  const ms = S.breathMs || 2000;
  cells.forEach(p=>S.grid[p.r][p.c].el.classList.add("lit"));
  const boxes = hits.map(h=>wordBox(h.seg));
  const clearBanner = breathBanner(hits.map(h=>h.w).join(" · "), ms);

  let held=false;
  /* the WHOLE SCREEN is the hold surface during the breath, minus the few controls that
     keep their own jobs. e.target is not always an element - a tap can be reported against
     the document itself - and calling closest() on that throws INSIDE the handler, which
     silently loses the hold rather than erroring anywhere visible. */
  const EXEMPT="#leaf,#star,#burger,#pouch,#veil,#picker,#sheet";
  const grab = e=>{
    const el = e.target && e.target.closest ? e.target.closest(EXEMPT) : null;
    if(el) return;
    held=true; e.stopPropagation(); e.preventDefault();
  };
  document.addEventListener("pointerdown", grab, true);
  for(let i=0, n=Math.round(ms/100); i<n && !held; i++) await wait(100);
  document.removeEventListener("pointerdown", grab, true);

  clearBanner();
  boxes.forEach(b=>b && b.remove());
  cells.forEach(p=>{ const c=S.grid[p.r][p.c]; if(c) c.el.classList.remove("lit"); });

  if(held){
    /* the letters stay, but as spent material - each remembers the word it was held as, so
       that exact word can never resolve from those exact tiles again */
    hits.forEach(h=>h.seg.forEach(p=>{ const c=S.grid[p.r][p.c]; if(c) c.heldWord=h.w; }));
    shout("kept - build something longer from these");
    await wait(900); hideShout();
  }
  return held;
}

async function resolve(){
  let chain=0;
  while(true){
    const hits=scan();
    if(!hits.length) break;
    chain++;
    const seen=new Set(); const cells=[];
    hits.forEach(h=>h.seg.forEach(p=>{ const k=p.r+","+p.c; if(!seen.has(k)){seen.add(k); cells.push(p);} }));
    /* a word already spent as a hold may not resolve again from the same tiles */
    const live=hits.filter(h=>!h.seg.every(p=>{ const c=S.grid[p.r][p.c]; return c && c.heldWord===h.w; }));
    if(!live.length) break;
    if(live.length!==hits.length){ hits.length=0; hits.push(...live);
      cells.length=0; const s2=new Set();
      hits.forEach(h=>h.seg.forEach(p=>{ const k=p.r+","+p.c; if(!s2.has(k)){ s2.add(k); cells.push(p); } })); }

    /* THE BREATH, first word only. Out of moves is urgent - there is nothing to build
       towards - so it does not stop to ask. */
    if(chain===1 && S.playerMove && S.moves>0){
      if(await breath(hits, cells)) { S.playerMove=false; return; }
    }

    const best=hits[0].w;
    let pts=0; cells.forEach(p=>pts+=(VAL[S.grid[p.r][p.c].l]||1));
    pts*=chain;
    /* ══ WHAT A WORD BUYS ══ three letters buy the wind, four or more earn a star, and only
       ever on the FIRST word of a resolution - a cascade is already its own reward. A tool
       never pays for itself, so the flags set when a tool was used suppress its own kind.
       A refusal at the cap is SAID: a player at three breezes who makes the word that buys
       one watched nothing happen and reported, reasonably, that the game paid a friend and
       not them. */
    let capSaid="";
    if(chain===1){
      const full=t=>t>=TOOL_CAP;
      if(best.length>=4){
        if(S.noWishGrant){ /* the wish paid for this word already */ }
        else if(full(S.star)) capSaid="wishes are full - spend one and the next long word earns another";
        else { S.star++; pop("star"); }
      } else if(best.length===3){
        if(S.noBreezeGrant){ /* the breeze paid for this word already */ }
        else if(full(S.leaf)) capSaid="breezes are full - spend one and the next 3-letter word buys another";
        else { S.leaf++; pop("leaf"); }
      }
    }
    /* THE BEAT. One letter at a time - light the tile, grow the banner by a character,
       165ms, again. The whole word arrives as a rhythm rather than as a result, and the
       banner is where the hold offer lives, so the two share one surface on purpose. */
    /* no box here: the breath already drew one round this word and took it away again.
       A cascade never gets a breath, so it never gets a box - which is the difference you
       can see between a word you made and a word the board made for you. */
    await beat(best, cells, pts, chain);
    S.score+=pts; S.wordsMade++;
    paint();
    await wait(240);
    cells.forEach(p=>{ const cell=S.grid[p.r][p.c]; cell.el.classList.add("gone");
      setTimeout(()=>cell.el.remove(),240); S.grid[p.r][p.c]=null; });
    await wait(240);
    gravity();
    await wait(300);
    /* the cap refusal waits for the word to finish speaking. Said at the same moment it was
       overwritten by "CAT +5" a frame later, which is the same silence it was written to
       fix - the player still sees nothing and still concludes the game skipped them. */
    if(capSaid){ shout(capSaid); await wait(1500); }
  }
  S.playerMove=false;
  if(chain) hideShout();
  if(S.score>=S.target){ S.busy=true; await wait(420); stageWon(); }
}

/* one frame around the whole word, drawn over the run's bounding box however long it is -
   a word is one thing, so it gets one frame rather than a cage round every letter */
function wordBox(cells){
  if(!cells.length) return null;
  const rs=cells.map(p=>p.r), cs=cells.map(p=>p.c);
  const r0=Math.min(...rs), r1=Math.max(...rs), c0=Math.min(...cs), c1=Math.max(...cs);
  const b=document.createElement("div"); b.className="wordbox";
  b.style.left=(colX(c0)-5)+"px"; b.style.top=(rowY(r0)-5)+"px";
  b.style.width=(colX(c1)-colX(c0)+TILE+10)+"px";
  b.style.height=(rowY(r1)-rowY(r0)+TILE+10)+"px";
  boardEl.appendChild(b);
  return b;
}
async function beat(word, cells, pts, chain){
  const wb=$("wb");
  wb.className="on"; wb.textContent="";
  wb.style.fontSize=(Math.min(16+word.length*2, 28)*(TILE/44)).toFixed(0)+"px";
  for(let i=0;i<word.length;i++){
    const p=cells[i]; if(p && S.grid[p.r][p.c]) S.grid[p.r][p.c].el.classList.add("lit");
    wb.textContent=word.slice(0,i+1).toUpperCase();
    await wait(165);
  }
  wb.innerHTML='<b>'+word.toUpperCase()+'</b><i class="wb-pts">+'+pts+(chain>1?" ×"+chain:"")+'</i>';
  wb.classList.add("done");
  await wait(430);
  wb.classList.remove("on","done");
  cells.forEach(p=>{ const cell=S.grid[p.r][p.c]; if(cell) cell.el.classList.remove("lit"); });
}
/* the breath: the word waits, and the offer to KEEP it lives on the word itself */
function breathBanner(word, ms){
  const wb=$("wb");
  wb.className="on breath";
  wb.style.fontSize=(Math.min(16+word.length*2, 28)*(TILE/44)).toFixed(0)+"px";
  wb.innerHTML='<b>'+word.toUpperCase()+'</b><span class="wb-tap">tap to hold</span>'
    +'<i class="wb-clock" style="animation-duration:'+ms+'ms"></i>';
  return ()=>wb.classList.remove("on","breath");
}
function gust(){ const g=document.createElement("div"); g.className="gustsweep";
  boardEl.appendChild(g); setTimeout(()=>g.remove(), 2200); }
function starfall(){
  for(let i=0;i<14;i++){
    const p=document.createElement("div"); p.className="starfall";
    p.textContent=["★","✦","✧"][i%3];
    p.style.left=(Math.random()*100)+"%"; p.style.top="0";
    p.style.setProperty("--fall",(boardEl.clientHeight*0.85+Math.random()*30)+"px");
    p.style.animationDuration=(1.1+Math.random()*0.7)+"s";
    p.style.animationDelay=(Math.random()*0.4)+"s";
    boardEl.appendChild(p); setTimeout(()=>p.remove(),2200);
  }
}
function gravity(){
  for(let c=0;c<COLS;c++){
    let write=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(S.grid[r][c]){
        if(write!==r){ S.grid[write][c]=S.grid[r][c]; S.grid[r][c]=null;
          S.grid[write][c].el.style.top=rowY(write)+"px";
          S.grid[write][c].el.style.zIndex=String(ROWS-write); }
        write--;
      }
    }
  }
}

function shout(t){ const s=$("shout"); s.textContent=t; s.classList.add("on"); }
function hideShout(){ $("shout").classList.remove("on"); }

function paint(){
  $("sc").textContent=S.score; $("tg").textContent=S.target;
  /* the ask is a whole sentence the level supplies, so it OWNS this line. It used to be
     "reach <span id=tg2>35</span> points" with the number written separately - and writing
     the sentence over it deleted the span, so the next paint threw on a null and the round
     silently stopped updating. One writer per element. */
  { const a=document.querySelector("#asktext p");
    if(a) a.textContent = S.ask || ("reach "+S.target+" points"); }
  $("mv").textContent=Math.max(0,S.moves); $("lvnum").textContent=S.lv;
  $("amber").textContent=S.amber; $("leafn").textContent=S.leaf; $("starn").textContent=S.star;
  $("words").textContent=S.wordsMade+"/"+S.wordsNeed;
  $("fill").style.transform="scaleX("+Math.min(1, S.score/S.target).toFixed(4)+")";
  $("cur").innerHTML=faceHTML(S.cur.l);
  $("nx").firstChild.textContent=S.next.l.toUpperCase();
  $("th").firstChild.textContent=S.then.l.toUpperCase();
  $("leaf").classList.toggle("out", S.leaf<=0);
  $("star").classList.toggle("out", S.star<=0);
}

/* ── the controls, all live ── */
function sheet(t,b){ $("sh-t").textContent=t; $("sh-b").textContent=b; $("sheet").classList.add("on"); }
function closeSheet(){ $("sheet").classList.remove("on"); }

$("pets").onclick=e=>{ if(e.target.closest(".seat")) return; $("pets").classList.toggle("boxed"); };
$("burger").onclick=()=>sheet("the wood","Menu, book of names, settings. Nothing behind it in this prototype - it is here so the panel is a real control rather than a drawing of one.");
$("pouch").onclick=()=>{ S.amber+=10; paint(); sheet("amber","Ten more. In the game amber buys comfort - a breeze, a wish, a way past a name you cannot spell - and never power."); };
$("badge").onclick=()=>sheet("this round","Five words to still the hush. The badge counts what you have made, the line beside it says what the round is asking for.");
$("asktext").onclick=()=>sheet("reach "+S.target+" points","Every word thins the hush. Longer words pay more, and a word made by a cascade pays double.");
$("seat0").onclick=()=>{ const on=$("seat0").classList.toggle("lit");
  $("catstate").textContent = on ? "Watching" : "Active";
  sheet("Calico", on ? "Taken off duty. A friend on the bench keeps its progress but stops acting." : "Back on duty. The cat pats a letter into one that fits when it wakes."); };
document.querySelectorAll(".seat.locked").forEach(s=>s.onclick=()=>sheet("locked","This seat opens later. In the game a friend arrives one level before the chair does, so there is always somebody waiting for it."));

/* ══════════════════════════════════════════════════════════════════════════════════════
   THE TWO TOOLS, ported from src/62-game-tools.js rather than invented.

   The prototype had both wrong, and wrong in the direction that quietly changes the game:

     THE BREEZE IS A SWAP, NOT A PLUCK. It lifts nothing off the board. You arm it, choose
     two letters, and a gust carries them past each other. Plucking a tile out is a
     different tool entirely (the mole's), and giving that power to the breeze would have
     made half the board's difficulty optional.

     THE WISH RESHAPES THE LETTER ALREADY IN YOUR HAND. It does not deal you a new one. That
     is why it can refuse: a hand holding an acorn or a star has nothing to reshape, and no
     wish is spent learning that.

   Neither swaps an obstacle. NONWORD is the game's own list of what will not budge - stone
   does not move, ice is frozen solid - and it is here in full even though stage one has no
   obstacles on the board yet, so that stage two does not have to remember to add it.

   A TOOL NEVER PAYS FOR ITSELF. A word made by a breeze grants no breeze and a word made by
   a wish grants no wish, or either becomes a perpetual motion machine. The OTHER tool still
   pays, so a breeze spent into a four-letter word is a real trade.
   ══════════════════════════════════════════════════════════════════════════════════════ */
const NONWORD=new Set(["bomb","stone","crate","ice","frost","mist","bramble","root","shroud",
  "pest","branch","spore","reed","mire","crystal","scree"]);
const TOOL_CAP=3;

function canSwap(cell){ return !!cell && !NONWORD.has(cell.kind||"normal"); }

function markSwappable(on){
  boardEl.classList.toggle("breezing", !!on);
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const cell=S.grid[r][c]; if(!cell) continue;
    const ok = !!on && canSwap(cell);
    cell.el.classList.toggle("swappable", ok);
    /* NEGATIVE delays, so every tile is already mid-sway on the first frame. A positive one
       makes each wait its turn and the mode looks like it is still loading. */
    if(ok) cell.el._face.style.animationDelay = "-" + (((c*5 + r*3) % 9) * 0.038).toFixed(3) + "s";
  }
}
function disarmBreeze(){
  S.armed=null; S.swapSel=null;
  $("leaf").classList.remove("armed");
  markSwappable(false);
  document.querySelectorAll(".tile.selswap").forEach(t=>t.classList.remove("selswap"));
  hideShout();
}
$("leaf").onclick=()=>{
  if(S.busy){ deny("leaf"); return shout("the board is still settling"); }
  if(S.armed==="breeze"){ disarmBreeze(); return; }
  if(S.leaf<=0){ deny("leaf"); return shout("no breezes left"); }
  S.armed="breeze"; S.swapSel=null;
  $("leaf").classList.add("armed");
  markSwappable(true);
  shout("choose two letters to trade places");
};
$("star").onclick=()=>{
  if(S.busy){ deny("star"); return shout("the board is still settling"); }
  if(S.armed==="breeze") disarmBreeze();
  if(S.star<=0){ deny("star"); return shout("no wishes left"); }
  /* a wish reshapes a letter - a hand with nothing to reshape refuses, and costs nothing */
  if(S.cur && S.cur.kind==="wild"){ deny("star"); return shout("that star is already every letter"); }
  if(S.cur && S.cur.kind==="bomb"){ deny("star"); return shout("the acorn is already what it wants to be"); }
  const g=$("pickgrid"); g.innerHTML="";
  "abcdefghijklmnopqrstuvwxyz".split("").forEach(l=>{
    const d=document.createElement("div"); d.textContent=l.toUpperCase();
    d.onclick=()=>{
      S.cur={ l, kind:"normal" };
      S.wishedHand=true;               // this letter is a wish's doing - see the grants below
      S.star--; $("picker").classList.remove("on"); paint(); starfall();
      $("cur").classList.remove("pop"); void $("cur").offsetWidth; $("cur").classList.add("pop");
    };
    g.appendChild(d);
  });
  $("picker").classList.add("on");
};
$("picker").onclick=e=>{ if(e.target.id==="picker") $("picker").classList.remove("on"); };

function pop(id){ const el=$(id); if(!el) return;
  el.classList.remove("won"); void el.offsetWidth; el.classList.add("won");
  setTimeout(()=>el.classList.remove("won"),420); }
function deny(id){ const el=$(id); if(!el) return;
  el.classList.remove("deny"); void el.offsetWidth; el.classList.add("deny");
  setTimeout(()=>el.classList.remove("deny"),380); }

/* the board answers the armed breeze: first tap selects, same tap deselects, second swaps */
boardEl.addEventListener("click", async e=>{
  if(S.armed!=="breeze" || S.busy) return;
  const el=e.target.closest(".tile"); if(!el) return;
  let hit=null;
  for(let r=0;r<ROWS && !hit;r++) for(let c=0;c<COLS;c++)
    if(S.grid[r][c] && S.grid[r][c].el===el){ hit={r,c,cell:S.grid[r][c]}; break; }
  if(!hit) return;
  if(!canSwap(hit.cell)){ deny("leaf"); shout("that one will not budge"); return; }

  if(!S.swapSel){ S.swapSel=hit; el.classList.add("selswap"); return; }
  if(S.swapSel.cell===hit.cell){ el.classList.remove("selswap"); S.swapSel=null; return; }

  const a=S.swapSel, b=hit;
  a.cell.el.classList.remove("selswap");
  S.busy=true; S.armed=null; S.swapSel=null;
  $("leaf").classList.remove("armed"); markSwappable(false); hideShout();

  gust();
  const ax=colX(a.c), ay=rowY(a.r), bx=colX(b.c), by=rowY(b.r);
  [a,b].forEach(x=>{ x.cell.el.style.transition="left .30s cubic-bezier(.4,.1,.3,1), top .30s cubic-bezier(.4,.1,.3,1)"; });
  a.cell.el.style.left=bx+"px"; a.cell.el.style.top=by+"px";
  b.cell.el.style.left=ax+"px"; b.cell.el.style.top=ay+"px";
  await wait(330);
  [a,b].forEach(x=>{ x.cell.el.style.transition=""; });
  S.grid[a.r][a.c]=b.cell; S.grid[b.r][b.c]=a.cell;
  anim(a.cell.el._face,"jostle",220); anim(b.cell.el._face,"jostle",220);
  S.leaf--; paint();

  /* the gust drifts for 1.8s and the word must not start under it - the whole complaint
     was that the wind and the resolution happened on top of each other. The swap lands,
     the air settles, and only then does the board start reading. */
  await wait(520);
  S.noBreezeGrant=true;                 // this word is the breeze's doing - it pays no breeze
  S.playerMove=true;                    // a tool's word is still yours - it gets a breath
  await resolve();
  S.noBreezeGrant=false;
  S.busy=false;
}, true);

const wait=ms=>new Promise(r=>setTimeout(r,ms));


/* ══ TEN STAGES ══ the real game's shape at small scale: a country per stretch, a target that
   climbs sub-linearly, moves that barely move, and a friend arriving one level before the
   seat that holds them. */
const LEVELS=[
  { lv:1,  bio:0, target:20, moves:15, words:3, ask:"reach 20 points" },
  { lv:2,  bio:0, target:26, moves:16, words:3, ask:"reach 26 points" },
  { lv:3,  bio:0, target:35, moves:19, words:5, ask:"reach 35 points" },
  { lv:4,  bio:0, target:42, moves:19, words:5, ask:"reach 42 points", meet:"Calico" },
  { lv:5,  bio:0, target:50, moves:20, words:5, ask:"reach 50 points" },
  { lv:6,  bio:1, target:58, moves:20, words:6, ask:"reach 58 points" },
  { lv:7,  bio:1, target:66, moves:21, words:6, ask:"reach 66 points", meet:"Ember" },
  { lv:8,  bio:1, target:75, moves:21, words:6, ask:"reach 75 points" },
  { lv:9,  bio:2, target:85, moves:22, words:7, ask:"reach 85 points" },
  { lv:10, bio:2, target:96, moves:24, words:7, ask:"reach 96 points", door:true },
];
const PORTRAIT={ Calico:"Cartoon_dog_face_calico_202608032352.jpeg",
                 Ember:"Cartoon_fox_face_portrait_202608032351.jpeg",
                 Snowpaw:"Cartoon_cat_face_portrait_202608032351.jpeg",
                 Bramble:"Cartoon_owl_face_expressive_eyes_202608032351.jpeg" };
let stage=0;

/* ONE CARD SHAPE for the intro, the clear, the meeting and the loss. Four differently shaped
   cards is how a game starts feeling like four games; what changes is the crown, the numbers
   and the verb on the button. */
function card(o){
  $("crown").textContent=o.crown||"";
  $("ctry").textContent=o.country||"";
  $("ctitle").innerHTML=o.title||"";
  $("csub").innerHTML=o.sub||"";
  $("cnums").innerHTML=(o.nums||[]).map(n=>"<div><b>"+n[0]+"</b><span>"+n[1]+"</span></div>").join("");
  $("stars").style.display=o.stars==null?"none":"flex";
  if(o.stars!=null) [...$("stars").children].forEach((el,i)=>el.classList.toggle("off", i>=o.stars));
  $("cmeet").style.display=o.face?"block":"none";
  if(o.face) $("cmeetimg").src="../alternate_art/"+o.face;
  $("cbtn").textContent=o.btn||"continue";
  $("cbtn").onclick=()=>{ hideCard(); if(o.go) o.go(); };
  $("calt").textContent=o.alt||"";
  $("calt").style.display=o.alt?"block":"none";
  $("calt").onclick=()=>{ hideCard(); if(o.altGo) o.altGo(); };
  $("veil").classList.add("on");
}
function hideCard(){ $("veil").classList.remove("on"); }

async function openStage(i){
  stage=Math.min(Math.max(0,i), LEVELS.length-1);
  const L=LEVELS[stage];
  await setCountry(L.bio);
  S.lv=L.lv; S.target=L.target; S.moves=L.moves; S.score=0; S.wordsMade=0; S.wordsNeed=L.words;
  S.ask=L.ask; S.busy=true; S.armed=null;
  document.querySelectorAll("#board .tile").forEach(t=>t.remove());
  S.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  const seed=[["c","w","s","h","u","l","i"],["r","e","b","e","u","w","t"]];
  seed.forEach((row,k)=>{ const r=ROWS-1-k;
    row.forEach((l,c)=>{ const t=makeTile(l,c,r,false); S.grid[r][c]={l,el:t}; }); });
  S.cur=piece(); S.next=piece(); S.then=piece();
  paint();
  card({ crown:L.door?"🗝️":"🌼", country:COUNTRIES[L.bio], title:"Level "+L.lv,
    sub:L.door?"The last of this country. Clear it and the road opens.":"",
    nums:[["target",L.target],["moves",L.moves]],
    btn:"play ▸", go:()=>{ S.busy=false; } });
}
function stageWon(){
  const L=LEVELS[stage];
  const spare=Math.max(0,S.moves), bonus=spare*2;
  S.score+=bonus; paint();
  const st = S.score>=L.target*1.6 ? 3 : S.score>=L.target*1.2 ? 2 : 1;
  const last = stage>=LEVELS.length-1;
  card({ country:COUNTRIES[L.bio], title:"Level "+L.lv+" clear", stars:st,
    nums:[["score",S.score],["words",S.wordsMade],["spare",spare]],
    sub: bonus ? "<b>+"+bonus+"</b> for "+spare+" moves you did not need" : "",
    btn: last ? "walk again ↺" : "next level ▸",
    go:()=>{ const nxt=last?0:stage+1;
             if(L.meet) meetFriend(L.meet, ()=>openStage(nxt)); else openStage(nxt); } });
}
function meetFriend(name, then){
  card({ face:PORTRAIT[name], country:"a friend", title:name+" heard its name",
    sub:"They walk with you from here. Their seat is on the shelf above the board.",
    btn:"welcome them", go:then });
}
function stageLost(){
  const L=LEVELS[stage];
  card({ crown:"🍃", country:COUNTRIES[L.bio], title:"out of moves",
    sub:"You reached <b>"+S.score+"</b> of "+L.target+". The hush holds, for now.",
    nums:[["short",Math.max(0,L.target-S.score)]],
    btn:"try again", go:()=>openStage(stage),
    alt:"leave to the wood", altGo:()=>openStage(0) });
}

/* ── open on a board that already has a floor, the way a round in progress looks ── */
function start(){
  S.grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  const seed=[["c","w","s","h","u","l","i"],["r","e","b","e","u","w","t"]];
  seed.forEach((row,i)=>{ const r=ROWS-1-i;
    row.forEach((l,c)=>{ const t=makeTile(l,c,r,false); S.grid[r][c]={l,el:t}; }); });
  S.cur=piece(); S.next=piece(); S.then=piece();
  paint();
}
/* start() is called at the BOTTOM of this file, not here. It reaches setCountry, which reads
   COUNTRIES and bio - both declared below as const/let, so calling it from here put them in
   their temporal dead zone. The throw happened inside an async call nobody awaited, so there
   was no error in the console and no card on screen: the game simply opened on its defaults
   and looked like the stage system had not been written. */

/* ══ THE COUNTRY DRESSES THE CHROME ══ the warm build measures each painting and derives its
   pane ink from it, because glass over fifteen different artworks cannot use one colour. The
   slate direction is opaque, so it does not NEED that - but it can still use it, and without
   it every country wears the First Clearing's navy.
   The painting is averaged, pushed to a common lightness so contrast never moves, and only
   its HUE is allowed through. That keeps white letters at a fixed, known contrast on every
   country while the panels still belong to the place they are standing in. */
const COUNTRIES=["The First Clearing","The Bramblewood","The Mosswood","The Spore Hollow",
  "The Listening Pond","The Reedmarsh","The Running River","The Thunderfalls","The Undercave",
  "The Deep Dark","The Glimmer Seams","The Scree Slopes","The Windward Ridge","The Snowline",
  "The Frozen Crown"];
let bio=0;
const rgb2hsl=(r,g,b)=>{ r/=255;g/=255;b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; let h=0,sa=0;
  if(mx!==mn){ const d=mx-mn; sa=l>.5? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h/=6; }
  return [h*360, sa, l]; };
async function setCountry(n){
  bio=(n+15)%15;
  const url="../art/bg/bio"+bio+".jpg";
  const img=new Image(); img.src=url;
  try{ await img.decode(); }catch(e){}
  boardEl.style.backgroundImage='url("'+url+'")';
  try{
    const c=document.createElement("canvas"); c.width=48; c.height=48;
    const g=c.getContext("2d"); g.drawImage(img,0,0,48,48);
    /* ══ THE SKY, NOT THE WHOLE PAINTING ══ averaging the entire image takes the ground with
       it, and the ground is grass. The First Clearing came out olive when the comp it is
       copied from is navy - because the comp took its colour from the sky the board hangs
       against, which is what a player reads as "the weather here". Top third only. */
    const d=g.getImageData(0,0,48,16).data;
    let r=0,gr=0,b=0,n2=0;
    for(let i=0;i<d.length;i+=4){ r+=d[i]; gr+=d[i+1]; b+=d[i+2]; n2++; }
    const [h,sa]=rgb2hsl(r/n2, gr/n2, b/n2);
    const S1=Math.min(.42, Math.max(.16, sa));
    const set=(k,l,s2)=>document.documentElement.style.setProperty(k,"hsl("+h.toFixed(0)+" "+((s2||S1)*100).toFixed(0)+"% "+l+"%)");
    set("--pane",27); set("--pane2",37); set("--line",42); set("--pouch",33); set("--slot",48);
    set("--page",92,.30);
    /* the dock belongs to the country too - it was the one surface still wearing the First
       Clearing on all fifteen maps, which read as unfinished rather than as constant */
    set("--dock",78,.22); set("--dockink",32,.30); set("--edge",82,.20);
    /* ══ THE LETTER TAKES THE COUNTRY'S HUE, NEVER ITS LEGIBILITY ══ a tinted ink is the
       cheapest way to make the board belong to the place, and the easiest way to quietly
       lose the game for anyone reading it in sunlight. So the hue is taken and the LIGHTNESS
       is solved for: darken until the measured contrast on the tile face clears 7:1, the
       ratio the untinted slate ink already held. Subtle is a look; readable is a floor. */
    const face=[253,251,247];
    const lin=v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); };
    const L=c=>.2126*lin(c[0])+.7152*lin(c[1])+.0722*lin(c[2]);
    const hsl2rgb=(hh,ss,ll)=>{ const a=ss*Math.min(ll,1-ll);
      const f=n=>{ const k=(n+hh/30)%12; return Math.round(255*(ll-a*Math.max(-1,Math.min(k-3,9-k,1)))); };
      return [f(0),f(8),f(4)]; };
    let inkL=.34, tries=0, ink=hsl2rgb(h,.30,inkL);
    while(tries++<40){
      const c=(Math.max(L(face),L(ink))+.05)/(Math.min(L(face),L(ink))+.05);
      if(c>=7) break;
      inkL-=.01; ink=hsl2rgb(h,.30,inkL);
    }
    document.documentElement.style.setProperty("--ink","hsl("+h.toFixed(0)+" 30% "+(inkL*100).toFixed(0)+"%)");
  }catch(e){}
  const t=$("country"); if(t) t.textContent=COUNTRIES[bio];
}
$("lvl").onclick=()=>{ setCountry(bio+1); S.lv=bio+1; paint();
  sheet(COUNTRIES[(bio)%15], "Country "+(bio+1)+" of 15. The panels take their hue from this painting and hold a fixed lightness, so the white letters read the same everywhere. Tap the level again to walk on."); };

const fit=()=>{ const s=Math.min(innerWidth/854, innerHeight/1842);
  $("fit").style.transform="translate("+((innerWidth-854*s)/2)+"px,"+((innerHeight-1842*s)/2)+"px) scale("+s+")"; };
addEventListener("resize", fit); fit();

/* everything is defined by here - now the first stage can safely open */
start();
openStage(0);
</script>
